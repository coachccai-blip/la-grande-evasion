<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1230">
<title>La Grande Évasion</title>
<style>
  /* ============================ Base & thème ============================ */
  :root{
    --bg:#160f26; --bg2:#20163a; --panel:#2a1e48; --panel2:#352a58;
    --ink:#f6f2ff; --ink-soft:#c9c0e4; --line:#4a3d73;
    --accent:#f2c14e; --accent2:#ffd977;
    --ok:#3fae5a; --ok2:#57d078; --ko:#e0574a; --ko2:#ff7566;
    /* couleurs des catégories (cf. §6) */
    --c-conjugaison:#3b82f6; --c-grammaire:#8b5cf6;
    --c-vocabulaire:#f59e0b; --c-orthographe:#22c55e; --c-melange:#ec78ac;
    --font:"Trebuchet MS","Segoe UI",Verdana,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--font); color:var(--ink);
    background:radial-gradient(120% 80% at 50% 0%,#2a1c4d 0%,var(--bg) 60%,#0f0a1c 100%);
    overflow:hidden; user-select:none;
  }
  img,canvas{image-rendering:pixelated; image-rendering:crisp-edges;}

  /* Cadre appli : portrait, centré, plein écran mobile */
  #app{
    position:relative; height:100dvh; width:100%;
    max-width:460px; margin:0 auto;
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,.5);
  }

  /* ============================== En-tête ============================== */
  header{
    flex:0 0 auto; padding:10px 12px 8px; text-align:center;
    background:linear-gradient(180deg,rgba(0,0,0,.25),transparent);
  }
  header h1{
    margin:0; font-size:20px; letter-spacing:2px; text-transform:uppercase;
    color:var(--accent); text-shadow:0 2px 0 #7a4a00, 0 0 12px rgba(242,193,78,.35);
  }
  header .sub{font-size:11px; color:var(--ink-soft); letter-spacing:.5px; margin-top:2px;}

  /* ============================== Scènes =============================== */
  main{flex:1 1 auto; position:relative; overflow:hidden;}
  .screen{position:absolute; inset:0; display:none; flex-direction:column; overflow:hidden;}
  .screen.active{display:flex;}
  .scroll{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px; flex:1;}

  /* ============================== Boutons ============================== */
  .btn{
    font-family:var(--font); font-weight:700; letter-spacing:.5px;
    border:0; border-radius:12px; padding:14px 18px; font-size:16px; color:#241a12;
    background:linear-gradient(180deg,var(--accent2),var(--accent));
    box-shadow:0 4px 0 #a9781a, 0 6px 10px rgba(0,0,0,.35); cursor:pointer;
    transition:transform .05s, box-shadow .05s;
  }
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 #a9781a,0 3px 6px rgba(0,0,0,.35);}
  .btn[disabled]{opacity:.5; cursor:default; box-shadow:none; transform:none;}
  .btn.secondary{
    color:var(--ink); background:linear-gradient(180deg,var(--panel2),var(--panel));
    box-shadow:0 4px 0 #1c1436,0 6px 10px rgba(0,0,0,.35);
  }
  .btn.wide{width:100%;}
  .btn.small{padding:9px 12px; font-size:13px; border-radius:9px;}

  /* ========================= Écran Sélection ========================== */
  .lead{font-size:14px; color:var(--ink-soft); text-align:center; margin:2px 0 12px;}
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .animal-card{
    position:relative; background:var(--panel); border:2px solid var(--line);
    border-radius:14px; padding:8px 6px 10px; text-align:center; cursor:pointer;
    transition:transform .08s, border-color .1s, background .1s;
  }
  .animal-card:active{transform:scale(.96);}
  .animal-card.selected{border-color:var(--accent); background:var(--panel2); box-shadow:0 0 0 2px var(--accent) inset;}
  .animal-card canvas{width:64px; height:64px; display:block; margin:0 auto;}
  .animal-card .nm{font-size:12px; font-weight:700; margin-top:4px;}
  .animal-card .mission{
    position:absolute; top:5px; right:5px; width:20px; height:20px; border-radius:50%;
    background:var(--ok); color:#fff; font-size:13px; line-height:20px; font-weight:900;
    display:none; box-shadow:0 2px 4px rgba(0,0,0,.4);
  }
  .animal-card.done .mission{display:block;}
  .trait-box{
    min-height:40px; margin:14px 2px 6px; padding:10px 12px; border-radius:12px;
    background:var(--panel); border:1px dashed var(--line); font-size:13px; color:var(--ink-soft);
    text-align:center;
  }
  .progress{font-size:12px; color:var(--ink-soft); text-align:center; margin-top:8px;}

  /* =========================== Écran Jeu ============================== */
  .catbar{
    flex:0 0 auto; display:flex; gap:6px; padding:8px 10px; overflow-x:auto;
    background:rgba(0,0,0,.2); border-bottom:1px solid var(--line);
  }
  .cat-btn{
    flex:0 0 auto; border:2px solid transparent; border-radius:20px; padding:6px 12px;
    font-size:12px; font-weight:700; color:#fff; cursor:pointer; opacity:.72;
    display:flex; align-items:center; gap:6px; background:var(--panel);
  }
  .cat-btn .dot{width:10px; height:10px; border-radius:50%; background:#fff;}
  .cat-btn.active{opacity:1; border-color:#fff; box-shadow:0 0 10px rgba(255,255,255,.25);}

  #boardWrap{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; background:#0e0a1c; position:relative;}
  #board{display:block; width:100%; height:auto;}

  .gamebar{
    flex:0 0 auto; padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,rgba(0,0,0,.35),transparent);
    display:flex; align-items:center; gap:10px;
  }
  .players-mini{flex:1; display:flex; gap:8px; overflow-x:auto;}
  .pm{display:flex; align-items:center; gap:5px; background:rgba(0,0,0,.28); border-radius:10px; padding:4px 7px; font-size:11px; white-space:nowrap;}
  .pm canvas{width:22px; height:22px;}
  .pm.you{outline:2px solid var(--accent);}
  .pm .pos{font-weight:800; color:var(--accent2);}

  /* ============================== Dé ================================= */
  #dice{
    width:56px; height:56px; border-radius:12px; background:#fbf6ea;
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    padding:8px; gap:3px; box-shadow:0 4px 0 #b9a98a, inset 0 0 0 3px #e4d6b8; flex:0 0 auto;
  }
  #dice .pip{border-radius:50%; background:transparent;}
  #dice .pip.on{background:#2b2333; box-shadow:inset 0 0 0 1px #000;}

  /* =========================== Superpositions ========================= */
  .overlay{
    position:absolute; inset:0; z-index:30; display:none;  /* portail = 30 (arrière-plan) */
    align-items:center; justify-content:center; padding:16px;
    background:rgba(10,6,20,.72); backdrop-filter:blur(2px);
  }
  .overlay.show{display:flex;}
  /* la carte de question passe au-dessus du portail ; l'écran de fin au-dessus de tout */
  #questionOverlay{z-index:50;}
  #endScreen{z-index:60;}
  .card{
    width:100%; max-width:400px; background:var(--panel); border:3px solid var(--line);
    border-radius:18px; padding:16px; box-shadow:0 12px 40px rgba(0,0,0,.5);
  }
  .qhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .badge{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.5px;
    color:#fff; padding:4px 10px; border-radius:20px;}
  .timer{height:8px; border-radius:6px; background:rgba(0,0,0,.35); overflow:hidden; margin-bottom:10px; display:none;}
  .timer > i{display:block; height:100%; width:100%; background:linear-gradient(90deg,var(--ko),var(--accent)); transition:width .1s linear;}
  .qtext{font-size:18px; line-height:1.5; margin:6px 2px 14px; text-align:center;}
  .qtext .blank{display:inline-block; min-width:56px; border-bottom:3px solid var(--accent); margin:0 3px; color:transparent;}
  .qtext .fill{color:var(--accent2); font-weight:800; border-bottom:3px solid var(--accent2);}
  .opts{display:grid; gap:8px;}
  .opt{
    text-align:left; border:2px solid var(--line); background:var(--panel2); color:var(--ink);
    border-radius:12px; padding:12px 14px; font-size:15px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; gap:10px; font-family:var(--font);
  }
  .opt .lt{width:24px; height:24px; border-radius:6px; background:var(--line); color:#fff;
    font-size:13px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
  .opt.correct{border-color:var(--ok2); background:rgba(63,174,90,.22);}
  .opt.correct .lt{background:var(--ok);}
  .opt.wrong{border-color:var(--ko2); background:rgba(224,87,74,.22);}
  .opt.wrong .lt{background:var(--ko);}
  .opt[disabled]{cursor:default;}
  .qnote{margin-top:12px; font-size:13px; text-align:center; min-height:18px; color:var(--ink-soft);}
  .qnote.good{color:var(--ok2);} .qnote.bad{color:var(--ko2);}

  /* ============================ Portail ============================== */
  #portalScreen .card{text-align:center;}
  .locks{display:flex; justify-content:center; gap:16px; margin:6px 0 12px;}
  .lock{width:44px; height:52px; border-radius:8px; background:var(--panel2); border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--ink-soft);}
  .lock.open{background:rgba(63,174,90,.25); border-color:var(--ok2); color:var(--ok2);}
  .portal-hint{font-size:13px; color:var(--ink-soft); margin-bottom:8px;}

  /* ============================ Fin de partie ======================== */
  #endScreen .card{text-align:center;}
  #endArt{width:96px; height:96px; margin:4px auto 8px;}
  #endTitle{font-size:24px; margin:4px 0; letter-spacing:1px;}
  #endTitle.win{color:var(--accent2);} #endTitle.lose{color:var(--ko2);}
  .bubble{
    position:relative; display:inline-block; margin:10px auto 14px; max-width:300px;
    background:#fff; color:#241a2f; border-radius:14px; padding:12px 14px; font-weight:700; font-style:italic;
  }
  .bubble:after{content:""; position:absolute; bottom:-10px; left:50%; transform:translateX(-50%);
    border:10px solid transparent; border-top-color:#fff;}

  /* ============================= Historique ========================== */
  .hist-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
  .stat{display:flex; gap:10px;}
  .chip{font-size:12px; font-weight:800; padding:5px 9px; border-radius:20px;}
  .chip.ok{background:rgba(63,174,90,.2); color:var(--ok2);}
  .chip.ko{background:rgba(224,87,74,.2); color:var(--ko2);}
  .hist-item{
    display:flex; gap:10px; align-items:flex-start; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:10px; margin-bottom:8px;
  }
  .hist-res{width:26px; height:26px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center;
    justify-content:center; font-weight:900; color:#fff; font-size:16px;}
  .hist-res.ok{background:var(--ok);} .hist-res.ko{background:var(--ko);}
  .hist-main{flex:1; font-size:14px;}
  .hist-cat{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:#fff;
    padding:2px 8px; border-radius:12px; display:inline-block; margin-bottom:4px;}
  .hist-phrase .fill{color:var(--accent2); font-weight:800;}
  .hist-wrong{font-size:12px; color:var(--ko2); margin-top:3px;}
  .empty{text-align:center; color:var(--ink-soft); margin-top:40px; font-size:14px;}

  /* ============================= Nav du bas ========================== */
  nav{
    flex:0 0 auto; display:flex; border-top:1px solid var(--line);
    background:var(--bg2); padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    flex:1; border:0; background:transparent; color:var(--ink-soft); font-family:var(--font);
    font-weight:700; font-size:13px; padding:12px 0; cursor:pointer; display:flex;
    flex-direction:column; align-items:center; gap:3px;
  }
  nav button .ic{font-size:18px;}
  nav button.active{color:var(--accent2);}

  /* ============================== Toast ============================== */
  #toast{
    position:absolute; left:50%; bottom:88px; transform:translateX(-50%) translateY(20px);
    background:rgba(0,0,0,.82); color:#fff; padding:9px 16px; border-radius:20px; font-size:13px;
    font-weight:700; z-index:80; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
    max-width:90%; text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>La Grande Évasion</h1>
    <div class="sub">Réponds juste et aide ton animal à s'échapper du zoo&nbsp;!</div>
  </header>

  <main>
    <!-- ===================== Écran : Sélection ===================== -->
    <section id="selectScreen" class="screen active">
      <div class="scroll">
        <div class="lead">Choisis ton animal</div>
        <div id="animalGrid" class="grid"></div>
        <div id="traitBox" class="trait-box">Touche un animal pour découvrir son caractère.</div>
        <div id="missionProgress" class="progress"></div>
        <div style="margin-top:12px;">
          <button id="startBtn" class="btn wide" disabled>C'est parti&nbsp;!</button>
        </div>
      </div>
    </section>

    <!-- ======================= Écran : Jeu ======================== -->
    <section id="gameScreen" class="screen">
      <div id="catbar" class="catbar"></div>
      <div id="boardWrap"><canvas id="board"></canvas></div>
      <div class="gamebar">
        <div id="playersMini" class="players-mini"></div>
        <div id="dice"></div>
        <button id="rollBtn" class="btn">Lancer le dé</button>
      </div>
    </section>

    <!-- ==================== Écran : Historique ==================== -->
    <section id="histScreen" class="screen">
      <div class="scroll">
        <div class="hist-head">
          <div class="stat">
            <span class="chip ok" id="statOk">✓ 0</span>
            <span class="chip ko" id="statKo">✗ 0</span>
          </div>
          <button id="clearHist" class="btn secondary small">Effacer</button>
        </div>
        <div id="histList"></div>
      </div>
    </section>

    <!-- =================== Superposition : Question ================ -->
    <div id="questionOverlay" class="overlay">
      <div class="card">
        <div class="qhead">
          <span id="qBadge" class="badge">Catégorie</span>
          <span id="qContext" style="font-size:12px;color:var(--ink-soft)"></span>
        </div>
        <div id="qTimer" class="timer"><i></i></div>
        <div id="qText" class="qtext"></div>
        <div id="qOpts" class="opts"></div>
        <div id="qNote" class="qnote"></div>
      </div>
    </div>

    <!-- ==================== Écran : Portail ======================= -->
    <div id="portalScreen" class="overlay">
      <div class="card">
        <div style="font-size:20px;font-weight:800;letter-spacing:1px;margin-bottom:4px;">Le grand portail&nbsp;!</div>
        <div class="portal-hint">Ouvre les 3 serrures : 3 bonnes réponses d'affilée.</div>
        <div class="locks">
          <div class="lock" data-lock="0">🔒</div>
          <div class="lock" data-lock="1">🔒</div>
          <div class="lock" data-lock="2">🔒</div>
        </div>
        <div id="portalStatus" style="font-size:13px;color:var(--ink-soft);min-height:18px;"></div>
      </div>
    </div>

    <!-- =================== Écran : Fin de partie ================== -->
    <div id="endScreen" class="overlay">
      <div class="card">
        <canvas id="endArt" width="96" height="96"></canvas>
        <div id="endTitle"></div>
        <div id="endBubbleWrap"></div>
        <div id="endMsg" style="font-size:14px;color:var(--ink-soft);margin-bottom:14px;"></div>
        <button id="rematchBtn" class="btn wide">Rejouer</button>
        <button id="backSelectBtn" class="btn secondary wide" style="margin-top:8px;">Changer d'animal</button>
      </div>
    </div>

    <div id="toast"></div>
  </main>

  <nav>
    <button id="tabGame" class="active"><span class="ic">🎲</span>Jeu</button>
    <button id="tabHist"><span class="ic">📜</span>Historique</button>
  </nav>
</div>

<script src="questions.js"></script>
<script src="animaux.js"></script>
<script src="sprites.js"></script>
<script>
"use strict";
/* ====================================================================
   La Grande Évasion — logique du jeu
   ==================================================================== */

/* ---------------------------- Constantes --------------------------- */
var BOARD = 50;                 // case du portail
var BOT_SUCCESS = 0.55;         // probabilité de réussite des bots (§2.4)
var DEFI_TIME = 10;             // secondes du défi éclair

var CATS = ["conjugaison","grammaire","vocabulaire","orthographe"];
var CAT_LABEL = {conjugaison:"Conjugaison",grammaire:"Grammaire",vocabulaire:"Vocabulaire",orthographe:"Orthographe",melange:"Mélange"};
var CAT_COLOR = {
  conjugaison:"#3b82f6", grammaire:"#8b5cf6", vocabulaire:"#f59e0b",
  orthographe:"#22c55e", melange:"#ec78ac"
};

/* Cases spéciales (§4.2) — ~1 case sur 4. */
var SPECIALS = {3:"banane",6:"gardien",9:"mystere",13:"toboggan",16:"duel",
  22:"defi",26:"banane",29:"gardien",33:"mystere",38:"toboggan",42:"duel",47:"defi"};
var SPECIAL_LABEL = {banane:"Banane bonus",toboggan:"Toboggan",gardien:"Gardien !",
  defi:"Défi éclair",duel:"Duel",mystere:"Case mystère"};

/* Obstacles fixes (§4.3) */
var OBSTACLES = {18:"le pont de singe",34:"la rivière des crocodiles",45:"la grille d'entretien"};

/* Zones (§4.1) */
var ZONES = [
  {name:"Les enclos",         band:"#6b5d2e", tile:"#d9c77e"},
  {name:"La savane",          band:"#8a5a24", tile:"#e6a763"},
  {name:"La serre tropicale", band:"#1f6b3a", tile:"#5cba76"},
  {name:"Le bassin polaire",  band:"#245e78", tile:"#7fd0ea"},
  {name:"L'esplanade",        band:"#5a5750", tile:"#c9c2b4"}
];
function zoneOf(s){ if(s<=0) return 0; return Math.min(4, Math.floor((s-1)/10)); }

/* --------------------------- Sauvegarde ---------------------------- */
var SAVE_KEY = "lge_save_v1";
var store = {history:[], missions:{}, game:null};
function loadSave(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(raw){ var o = JSON.parse(raw);
      store.history = o.history||[]; store.missions = o.missions||{}; store.game = o.game||null; }
  }catch(e){ /* repli silencieux si localStorage indisponible (§12) */ }
}
function persist(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(store)); }catch(e){}
}

/* --------------------------- État courant -------------------------- */
var G = null;        // partie en cours
var busy = false;    // verrou pendant animations/questions
var usedQ = {};      // suivi des questions déjà posées (RG10)
CATS.forEach(function(c){ usedQ[c] = []; });

/* --------------------------- Utilitaires --------------------------- */
function $(id){ return document.getElementById(id); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function randint(n){ return Math.floor(Math.random()*n); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=randint(i+1); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function toast(msg, ms){
  var t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove("show"); }, ms||1600);
}

function animalById(id){ for(var i=0;i<ANIMAUX.length;i++){ if(ANIMAUX[i].id===id) return ANIMAUX[i]; } return null; }

/* Choix d'une question en respectant RG10 (pas de répétition prématurée). */
function pickQuestion(cat){
  var realCat = (cat==="melange") ? CATS[randint(CATS.length)] : cat;
  var pool = [];
  for(var i=0;i<QUESTIONS.length;i++){ if(QUESTIONS[i].cat===realCat) pool.push(i); }
  if(pool.length===0){ // repli : n'importe quelle catégorie
    for(var k=0;k<QUESTIONS.length;k++) pool.push(k); realCat = QUESTIONS[pool[0]].cat;
  }
  var used = usedQ[realCat] || (usedQ[realCat]=[]);
  var fresh = pool.filter(function(idx){ return used.indexOf(idx)<0; });
  if(fresh.length===0){ used.length=0; fresh = pool.slice(); }   // cycle recommencé
  var chosen = fresh[randint(fresh.length)];
  used.push(chosen);
  return {index:chosen, q:QUESTIONS[chosen], cat:realCat};
}

/* ----------------------- Sprites utilitaires ----------------------- */
function makeAnimalCanvas(id, px){
  var c=document.createElement("canvas");
  var u=Math.floor(px/16); c.width=16*u; c.height=16*u;
  c.style.width=px+"px"; c.style.height=px+"px";
  var ctx=c.getContext("2d");
  SPRITES.animal(ctx, id, 0, 0, u);
  return c;
}

/* ==================================================================== */
/*                        ÉCRAN DE SÉLECTION                            */
/* ==================================================================== */
var selectedAnimal = null;
function buildSelect(){
  var grid=$("animalGrid"); grid.innerHTML="";
  ANIMAUX.forEach(function(a){
    var card=document.createElement("div");
    card.className="animal-card" + (store.missions[a.id]?" done":"");
    card.appendChild(makeAnimalCanvas(a.id,64));
    var nm=document.createElement("div"); nm.className="nm"; nm.textContent=a.name; card.appendChild(nm);
    var m=document.createElement("div"); m.className="mission"; m.textContent="✓"; card.appendChild(m);
    card.onclick=function(){ selectAnimal(a.id, card); };
    grid.appendChild(card);
  });
  updateMissionProgress();
}
function selectAnimal(id, card){
  selectedAnimal=id;
  var cards=document.querySelectorAll(".animal-card");
  for(var i=0;i<cards.length;i++) cards[i].classList.remove("selected");
  if(card) card.classList.add("selected");
  var a=animalById(id);
  $("traitBox").innerHTML = "<b>"+a.name+"</b> — "+a.trait +
    (store.missions[id] ? " <span style='color:var(--ok2)'>(mission accomplie ✓)</span>" : "");
  $("startBtn").disabled=false;
}
function updateMissionProgress(){

  $("missionProgress").textContent = "Missions : "+done+" / "+ANIMAUX.length+" animaux libérés";
}

/* ==================================================================== */
/*                          PLATEAU (canvas)                            */
/* ==================================================================== */
var COLS=5, ROWS=11, COLW=64, ROWH=64, SIDE=60, TOPPAD=150, BOTPAD=176;
var boardW=SIDE*2+COLS*COLW, boardH=TOPPAD+ROWS*ROWH+BOTPAD;
var bctx=null, boardStatic=null;
var DECO=SPRITES.deco, ELL=SPRITES.ellipse, CIR=SPRITES.circle, RQ=SPRITES.R;

function initBoard(){
  var cv=$("board"); cv.width=boardW; cv.height=boardH; bctx=cv.getContext("2d");
  boardStatic=document.createElement("canvas"); boardStatic.width=boardW; boardStatic.height=boardH;
  buildStaticBoard();
}
function cellOf(s){
  var row=Math.floor(s/COLS), idx=s%COLS;
  var col=(row%2===0)? idx : (COLS-1-idx);
  var x=SIDE+col*COLW, y=TOPPAD+(ROWS-1-row)*ROWH;
  return {x:x, y:y, cx:x+COLW/2, cy:y+ROWH/2};
}
function roundRect(ctx,x,y,w,h,r,fill,stroke){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.stroke(); }
}
// PRNG déterministe pour un décor stable
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

// Le décor (statique) est peint une seule fois hors-écran.
function buildStaticBoard(){
  var ctx=boardStatic.getContext("2d");
  var rng=mulberry32(20260810);
  ctx.clearRect(0,0,boardW,boardH);

  // --- fond herbe ---
  var g=ctx.createLinearGradient(0,0,0,boardH);
  g.addColorStop(0,"#5aa64f"); g.addColorStop(.45,"#3f8f45"); g.addColorStop(1,"#357a3a");
  ctx.fillStyle=g; ctx.fillRect(0,0,boardW,boardH);
  // texture herbe
  for(var i=0;i<520;i++){ var x=rng()*boardW, y=rng()*boardH; ctx.fillStyle=rng()<.5?"rgba(255,255,255,.05)":"rgba(0,0,0,.06)"; ctx.fillRect(x,y,2,2); }

  // --- plans d'eau / patchs de sol par zone ---
  DECO.pond(ctx, 30, cellOf(6).cy, 20, 12);
  DECO.pond(ctx, boardW-30, cellOf(15).cy, 18, 11);
  ctx.fillStyle="rgba(226,205,120,.35)"; ELL(ctx, 34, cellOf(13).cy+18, 30, 16, "rgba(226,205,120,.30)"); // sable savane
  ctx.fillStyle="#dff2fb"; ELL(ctx, 32, cellOf(35).cy, 34, 20, "rgba(215,238,250,.55)"); // neige polaire
  DECO.pond(ctx, boardW-32, cellOf(37).cy, 20, 12);

  // --- forêt sur tout le pourtour ---
  function edgeTree(x,y){ var t=rng(); if(t<.5) DECO.tree(ctx,x,y,1.4); else if(t<.75) DECO.pine(ctx,x,y,1.2); else DECO.tree(ctx,x,y,1.1); }
  for(var yy=TOPPAD-30; yy<boardH-40; yy+=34){
    edgeTree(8+rng()*10, yy+rng()*10);
    edgeTree(boardW-8-rng()*10, yy+rng()*10);
  }
  // frange d'arbres tout en haut (derrière le portail)
  for(var xx=14; xx<boardW-10; xx+=26){ DECO.tree(ctx, xx+rng()*8, 26+rng()*10, 1.3); }

  // --- décor thématique par zone + panneaux ---
  DECO.acacia(ctx, boardW-40, cellOf(14).cy-6, 1.5);
  DECO.acacia(ctx, 46, cellOf(19).cy, 1.2);
  DECO.bamboo(ctx, boardW-42, cellOf(24).cy, 1.3); DECO.bamboo(ctx, 44, cellOf(27).cy, 1.2);
  DECO.palm(ctx, boardW-38, cellOf(22).cy-8, 1.5);
  DECO.ice(ctx, 40, cellOf(33).cy, 1.4); DECO.ice(ctx, boardW-40, cellOf(40).cy, 1.2);
  DECO.fountain(ctx, boardW-40, cellOf(46).cy, 1.3);
  DECO.fence(ctx, cellOf(0).cx-6, cellOf(0).cy-26, 130, 1.2);

  // bancs, lampadaires, buissons, fleurs (semés)
  DECO.bench(ctx, boardW-40, cellOf(43).cy+16, 1.2);
  DECO.bench(ctx, 40, cellOf(9).cy, 1.1);
  DECO.lamp(ctx, boardW-16, cellOf(48).cy+10, 1.1);
  DECO.lamp(ctx, 18, cellOf(2).cy+6, 1.1);
  var flowerCols=["#e0574a","#f2c14e","#ec78ac","#8b5cf6","#ffffff"];
  for(var f=0; f<70; f++){
    var fx, side=rng()<.5;
    fx = side ? (6+rng()*(SIDE-14)) : (boardW-6-rng()*(SIDE-14));
    var fy=TOPPAD+rng()*(ROWS*ROWH);
    if(rng()<.5) DECO.flower(ctx, fx, fy, flowerCols[(rng()*flowerCols.length)|0]);
    else DECO.tuft(ctx, fx, fy, 1);
  }
  for(var bsh=0; bsh<16; bsh++){
    var bx = rng()<.5 ? (14+rng()*(SIDE-20)) : (boardW-14-rng()*(SIDE-20));
    DECO.bush(ctx, bx, TOPPAD+20+rng()*(ROWS*ROWH-40), 1+rng()*0.4);
  }
  DECO.rock(ctx, boardW-46, cellOf(40).cy-14, 1.4);
  DECO.rock(ctx, 44, cellOf(30).cy, 1.2);

  // --- grands animaux décoratifs (dans les marges) ---
  function bigAnimal(id,cx,cy,u){ SPRITES.animal(ctx, id, cx-8*u, cy-8*u, u); }
  var LX=34, RX=boardW-34;
  bigAnimal("lion",     LX, cellOf(11).cy, 3);
  bigAnimal("girafe",   RX, cellOf(17).cy, 3);
  bigAnimal("singe",    LX, cellOf(23).cy, 3);
  bigAnimal("panda",    RX, cellOf(27).cy, 3);
  bigAnimal("manchot",  LX, cellOf(34).cy, 3);
  bigAnimal("elephant", RX, cellOf(32).cy, 3);
  bigAnimal("crocodile",RX, cellOf(38).cy, 3);
  bigAnimal("flamant",  LX, cellOf(44).cy, 3);

  // panneaux de zone
  DECO.sign(ctx, RX, cellOf(4).cy, "Les enclos");
  DECO.sign(ctx, LX, cellOf(15).cy+20, "La savane");
  DECO.sign(ctx, RX, cellOf(21).cy, "La serre");
  DECO.sign(ctx, LX, cellOf(31).cy, "Le bassin");
  DECO.sign(ctx, RX, cellOf(43).cy, "L'esplanade");

  // --- portail LIBERTÉ (haut) et entrée du ZOO (bas) ---
  DECO.gate(ctx, boardW/2, 48, 1.5);
  DECO.zoo(ctx, boardW/2, boardH-BOTPAD+30, 1.5);
  ctx.fillStyle="#f3ead2"; ctx.font="bold 12px monospace"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("DÉPART", boardW/2, boardH-BOTPAD+92);

  // --- chemin (liens en pierre) ---
  for(var s=0;s<BOARD;s++){
    var a=cellOf(s), b=cellOf(s+1);
    linkSeg(ctx,a.cx,a.cy,b.cx,b.cy,13,"#6f7a63");   // bordure
    linkSeg(ctx,a.cx,a.cy,b.cx,b.cy,10,"#d9c79a");   // remplissage
  }

  // --- cases ---
  for(var s2=0;s2<=BOARD;s2++){
    var c=cellOf(s2);
    var tw=COLW-14, th=ROWH-18, tx=c.cx-tw/2, ty=c.cy-th/2;
    // ombre
    roundRect(ctx, tx+2, ty+3, tw, th, 8, "rgba(0,0,0,.22)", null);
    // bordure pierre + remplissage sable
    roundRect(ctx, tx, ty, tw, th, 8, "#7c8168", null);
    roundRect(ctx, tx+2, ty+2, tw-4, th-4, 6, "#ecdcae", null);
    roundRect(ctx, tx+2, ty+2, tw-4, (th-4)/2, 6, "#f5ecc9", null);
    // numéro
    ctx.fillStyle="#4a3a1c"; ctx.font="bold 17px monospace"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(String(s2), c.cx, c.cy+1);
    // marqueurs
    if(s2===BOARD){ roundRect(ctx,tx+2,ty+2,tw-4,th-4,6,"#f2c14e",null); ctx.fillStyle="#4a3a1c"; ctx.fillText("50",c.cx,c.cy+1); DECO.star(ctx,c.cx+tw/2-8,ty+8,6,"#fff2b0"); }
    else if(OBSTACLES[s2]){ DECO.rockPile(ctx, c.cx, c.cy-2, 1.1); }
    else if(SPECIALS[s2]){ DECO.star(ctx, c.cx+tw/2-8, ty+9, 7, "#ffd94a"); }
    if(s2===0){ ctx.fillStyle="#2c7a3a"; ctx.font="bold 8px monospace"; ctx.fillText("★",c.cx-tw/2+8,ty+9); }
  }

  // --- panneau RÈGLES (bas-gauche) ---
  drawLegend(ctx, 10, boardH-150);
  // --- panneau hibou (bas-droite) ---
  drawOwlPanel(ctx, boardW-118, boardH-150);
}

// Segment de chemin (capsule) entre deux centres, axes alignés.
function linkSeg(ctx,x1,y1,x2,y2,half,color){
  var minx=Math.min(x1,x2)-half, miny=Math.min(y1,y2)-half;
  var w=Math.abs(x2-x1)+2*half, h=Math.abs(y2-y1)+2*half;
  roundRect(ctx,minx,miny,w,h,half,color,null);
}

function drawLegend(ctx,x,y){
  roundRect(ctx,x,y,150,140,8,"#7a4a24",null);
  roundRect(ctx,x+3,y+3,144,134,6,"#6b431f",null);
  roundRect(ctx,x+6,y+6,138,128,6,"#c98f57",null);
  ctx.fillStyle="#3a2410"; ctx.font="bold 12px monospace"; ctx.textAlign="left"; ctx.textBaseline="middle";
  ctx.fillText("RÈGLES", x+16, y+20);
  var ly=y+42;
  ctx.fillStyle="#2c8342"; ctx.fillText("▲", x+16, ly); ctx.fillStyle="#3a2410"; ctx.font="10px monospace"; ctx.fillText("Bonne réponse : avance", x+30, ly);
  ly+=26; ctx.font="bold 12px monospace"; ctx.fillStyle="#c0392b"; ctx.fillText("▼", x+16, ly); ctx.fillStyle="#3a2410"; ctx.font="10px monospace"; ctx.fillText("Mauvaise : recule", x+30, ly);
  ly+=26; DECO.star(ctx, x+18, ly, 6, "#ffd94a"); ctx.fillStyle="#3a2410"; ctx.fillText("Case spéciale", x+30, ly);
  ly+=26; DECO.rock(ctx, x+18, ly, 0.8); ctx.fillStyle="#3a2410"; ctx.fillText("Obstacle", x+30, ly);
}
function drawOwlPanel(ctx,x,y){
  roundRect(ctx,x,y,108,140,8,"#7a4a24",null);
  roundRect(ctx,x+4,y+4,100,132,6,"#c98f57",null);
  SPRITES.animal(ctx,"hibou", x+34, y+14, 2.4);
  ctx.fillStyle="#3a2410"; ctx.font="bold 11px monospace"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("APPRENDS", x+54, y+78);
  ctx.fillText("JOUE", x+54, y+96);
  ctx.fillText("ÉCHAPPE !", x+54, y+114);
}

function drawBoard(){
  if(!bctx) return;
  if(!boardStatic) buildStaticBoard();
  bctx.clearRect(0,0,boardW,boardH);
  bctx.drawImage(boardStatic,0,0);
  if(G){
    var byCell={};
    G.players.forEach(function(p,i){ (byCell[p.pos]=byCell[p.pos]||[]).push(i); });
    Object.keys(byCell).forEach(function(pos){
      var occ=byCell[pos], c=cellOf(+pos);
      occ.forEach(function(pi,k){
        var p=G.players[pi], u=2, sz=16*u;
        var dx=(occ.length>1)?((k%2)?9:-9):0;
        var dy=(occ.length>2)?((k<2)?-7:7):0;
        var cx=c.cx+dx, cy=c.cy+dy-4;
        var ox=cx-sz/2, oy=cy-sz/2;
        bctx.fillStyle="rgba(0,0,0,.28)"; ELL(bctx, cx, oy+sz-1, sz*0.34, sz*0.14, "rgba(0,0,0,.28)");
        if(pi===0){ DECO.star(bctx, cx, oy-4, 5, "#ffd94a"); }  // marqueur "toi"
        SPRITES.animal(bctx, p.animalId, ox, oy, u);
      });
    });
  }
  autoScroll();
}
function autoScroll(){
  if(!G) return;
  var wrap=$("boardWrap"), cv=$("board");
  if(!cv.clientWidth) return;
  var scale=cv.clientWidth/boardW;
  var c=cellOf(G.players[0].pos);
  var target=c.cy*scale - wrap.clientHeight/2;
  wrap.scrollTo({top:clamp(target,0,cv.scrollHeight-wrap.clientHeight), behavior:"smooth"});
}

var DICE_PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function renderDice(v){
  var d=$("dice"); d.innerHTML="";
  var on=DICE_PIPS[v]||[];
  for(var i=0;i<9;i++){ var p=document.createElement("div"); p.className="pip"+(on.indexOf(i)>=0?" on":""); d.appendChild(p); }
}
function rollDiceAnim(){
  return new Promise(function(resolve){
    var final=1+randint(6), n=0;
    var iv=setInterval(function(){
      renderDice(1+randint(6)); n++;
      if(n>=10){ clearInterval(iv); renderDice(final); resolve(final); }
    }, 70);
  });
}

/* Affiche une question et renvoie {correct, chosen, timedOut}.
   opts: {cat, contextLabel, timed:bool, record:bool} */
function askQuestion(opts){
  return new Promise(function(resolve){
    var picked=pickQuestion(opts.cat);
    var q=picked.q, realCat=picked.cat;
    var ov=$("questionOverlay");
    $("qBadge").textContent=CAT_LABEL[realCat]; $("qBadge").style.background=CAT_COLOR[realCat];
    $("qContext").textContent=opts.contextLabel||"";
    // phrase avec trou
    $("qText").innerHTML = q.phrase.replace("___","<span class='blank' id='blankSpot'>___</span>");
    var note=$("qNote"); note.textContent=""; note.className="qnote";
    // options mélangées (RG11)
    var order=shuffle(q.options.map(function(_,i){return i;}));
    var box=$("qOpts"); box.innerHTML="";
    var timer=$("qTimer"); var timerBar=timer.querySelector("i");
    var done=false, timeLeft=DEFI_TIME, tvi=null;

    function finish(chosenIdx, timedOut){
      if(done) return; done=true;
      if(tvi) clearInterval(tvi);
      var correct = (!timedOut && chosenIdx===q.answer);
      // révèle : bonne réponse toujours en évidence (§5)
      var btns=box.querySelectorAll(".opt");
      for(var i=0;i<btns.length;i++){
        var oi=+btns[i].getAttribute("data-oi");
        btns[i].setAttribute("disabled","");
        if(oi===q.answer) btns[i].classList.add("correct");
        if(!correct && chosenIdx!=null && oi===chosenIdx && oi!==q.answer) btns[i].classList.add("wrong");
      }
      // remplit le trou avec la bonne réponse
      var bs=$("blankSpot"); if(bs){ bs.textContent=q.options[q.answer]; bs.className="fill"; }
      note.textContent = timedOut ? "⏱ Temps écoulé ! La bonne réponse : "+q.options[q.answer]
                       : (correct ? "Bravo, c'est juste !" : "Raté ! La bonne réponse : "+q.options[q.answer]);
      note.className="qnote "+(correct?"good":"bad");
      // historique (RG12)
      if(opts.record){
        store.history.unshift({
          result:correct, cat:realCat, phrase:q.phrase, options:q.options.slice(),
          answer:q.answer, chosen:(timedOut? null : chosenIdx)
        });
        persist();
      }
      setTimeout(function(){ ov.classList.remove("show"); resolve({correct:correct, chosen:chosenIdx, timedOut:!!timedOut}); }, 1150);
    }

    order.forEach(function(oi, k){
      var b=document.createElement("button"); b.className="opt"; b.setAttribute("data-oi",oi);
      var lt=document.createElement("span"); lt.className="lt"; lt.textContent=String.fromCharCode(65+k);
      var tx=document.createElement("span"); tx.textContent=q.options[oi];
      b.appendChild(lt); b.appendChild(tx);
      b.onclick=function(){ finish(oi,false); };
      box.appendChild(b);
    });

    if(opts.timed){
      timer.style.display="block"; timerBar.style.width="100%";
      tvi=setInterval(function(){
        timeLeft-=0.1; var pct=Math.max(0,timeLeft/DEFI_TIME*100); timerBar.style.width=pct+"%";
        if(timeLeft<=0){ finish(null,true); }
      },100);
    } else {
      timer.style.display="none";
    }
    ov.classList.add("show");
  });
}

function startGame(animalId){
  // 3 bots tirés au sort parmi les animaux non choisis (§2.4)
  var others=ANIMAUX.filter(function(a){ return a.id!==animalId; }).map(function(a){return a.id;});
  shuffle(others); var bots=others.slice(0,3);
  G={
    animalId:animalId, category:"melange",
    players:[{animalId:animalId, pos:0, skip:false, bot:false}]
      .concat(bots.map(function(b){ return {animalId:b, pos:0, skip:false, bot:true}; })),
    turnStartPos:0, over:false
  };
  store.game={animalId:animalId, category:G.category,
    players:G.players.map(function(p){return {animalId:p.animalId,pos:p.pos,skip:p.skip,bot:p.bot};}),
    turnStartPos:0, over:false};
  persist();
  enterGame();
}
function restoreGame(){
  var g=store.game; if(!g || g.over) return false;
  G={animalId:g.animalId, category:g.category||"melange",
     players:g.players.map(function(p){return {animalId:p.animalId,pos:p.pos,skip:!!p.skip,bot:!!p.bot};}),
     turnStartPos:g.turnStartPos||0, over:false};
  return true;
}
function saveGameState(){
  if(!G) return;
  store.game={animalId:G.animalId, category:G.category,
    players:G.players.map(function(p){return {animalId:p.animalId,pos:p.pos,skip:p.skip,bot:p.bot};}),
    turnStartPos:G.turnStartPos, over:G.over};
  persist();
}
function enterGame(){
  buildCatbar(); drawPlayersMini(); renderDice(1);
  showScreen("game"); setTab("game");
  drawBoard();
  $("rollBtn").disabled=false;
}

/* ==================================================================== */
/*                         DÉROULÉ D'UN TOUR                            */
/* ==================================================================== */
var me = function(){ return G.players[0]; };

async function playerRoll(){
  if(busy || !G || G.over) return;
  busy=true; $("rollBtn").disabled=true;

  // sieste surprise éventuelle (case mystère)
  if(me().skip){ me().skip=false; toast("Sieste surprise… tu passes ton tour 😴"); saveGameState(); await sleep(900); await botsPlay(); return endTurn(); }

  G.turnStartPos = me().pos;
  var d = await rollDiceAnim();
  toast("Tu as fait "+d+" !");
  await sleep(300);

  var res = await askQuestion({cat:G.category, record:true, contextLabel:"Avance de "+d+" si c'est juste"});
  if(res.correct){ await moveForward(0, me().pos + d, true); }
  else { await moveTo(0, Math.max(0, me().pos - d)); }

  // portail atteint ?
  if(!G.over && me().pos>=BOARD){
    var won = await portalChallenge();
    if(won){ return finishGame(true, 0); }
    else { await moveTo(0, G.turnStartPos, true); toast("Le portail s'est refermé… retour en arrière."); await sleep(400); }
  }
  if(G.over) return;
  await botsPlay();
  endTurn();
}

function endTurn(){
  saveGameState(); drawPlayersMini();
  busy=false; if(!G.over) $("rollBtn").disabled=false;
}

/* Déplacement avant en gérant les obstacles (RG07). */
async function moveForward(pi, target, applyEffect){
  var p=G.players[pi]; target=clamp(target,0,BOARD);
  var start=p.pos;
  // cherche le premier obstacle dans (start, target]
  while(true){
    var obs=null;
    for(var s=p.pos+1; s<=target; s++){ if(OBSTACLES[s]){ obs=s; break; } }
    if(obs===null){ await stepTo(pi, target); break; }
    await stepTo(pi, obs-1);
    // question défi pour franchir
    var r=await askQuestion({cat:G.category, record:true, contextLabel:"Franchir "+OBSTACLES[obs]});
    if(r.correct){ toast("Tu franchis "+OBSTACLES[obs]+" !"); /* continue vers target */ }
    else { toast("Bloqué devant "+OBSTACLES[obs]+" ce tour-ci."); return; }
    // continue la boucle : franchit l'obstacle et poursuit
    await stepTo(pi, obs);
  }
  if(applyEffect) await applySpecial(pi);
}
async function moveTo(pi, target, silent){
  await stepTo(pi, clamp(target,0,BOARD));
  if(!silent) await applySpecial(pi);
}
async function stepTo(pi, target){
  var p=G.players[pi]; target=clamp(target,0,BOARD);
  var dir = target>p.pos ? 1 : -1;
  while(p.pos!==target){
    p.pos+=dir; drawBoard(); drawPlayersMini(); await sleep(150);
  }
}

/* Effets des cases spéciales sur la case d'arrivée (RG06, ne se cumulent pas). */
async function applySpecial(pi){
  var p=G.players[pi]; if(p.pos<=0 || p.pos>=BOARD) return;
  var type=SPECIALS[p.pos]; if(!type) return;
  await sleep(200);
  if(type==="banane"){
    toast("🍌 Banane bonus ! Relance et avance.");
    var d=await rollDiceAnim(); await stepTo(pi, p.pos+d);
  } else if(type==="toboggan"){
    toast("🛝 Toboggan ! +4 cases."); await stepTo(pi, p.pos+4);
  } else if(type==="gardien"){
    toast("👮 Le gardien patrouille !");
    var r=await askQuestion({cat:G.category, record:true, contextLabel:"Évite le gardien"});
    if(!r.correct){ toast("Repéré ! −3 cases."); await stepTo(pi, Math.max(0,p.pos-3)); }
    else toast("Ni vu ni connu !");
  } else if(type==="defi"){
    toast("⚡ Défi éclair ! 10 secondes.");
    var r2=await askQuestion({cat:G.category, record:true, timed:true, contextLabel:"Vite ! +3 / −1"});
    if(r2.correct){ toast("+3 cases !"); await stepTo(pi, p.pos+3); }
    else { toast("−1 case."); await stepTo(pi, Math.max(0,p.pos-1)); }
  } else if(type==="duel"){
    toast("⚔️ Duel avec l'animal devant toi !");
    var ahead=nearestAhead(pi);
    var r3=await askQuestion({cat:G.category, record:true, contextLabel:"Gagne pour échanger de place"});
    if(r3.correct && ahead>=0){
      var tmp=G.players[pi].pos; G.players[pi].pos=G.players[ahead].pos; G.players[ahead].pos=tmp;
      toast("Échange réussi avec "+animalById(G.players[ahead].animalId).name+" !");
      drawBoard(); drawPlayersMini();
    } else if(r3.correct){ toast("Personne devant toi… duel gagné dans le vide !"); }
    else { toast("Duel perdu."); }
  } else if(type==="mystere"){
    var roll=randint(4);
    if(roll===0){ toast("🍃 Vent favorable ! +2"); await stepTo(pi, p.pos+2); }
    else if(roll===1){ toast("🥜 Chute de cacahuètes ! +1"); await stepTo(pi, p.pos+1); }
    else if(roll===2){ toast("👟 Lacet défait ! −1"); await stepTo(pi, Math.max(0,p.pos-1)); }
    else { toast("😴 Sieste surprise ! Tu passeras ton prochain tour."); p.skip=true; }
  }
}
function nearestAhead(pi){
  var p=G.players[pi], best=-1, bestPos=999;
  G.players.forEach(function(o,i){ if(i!==pi && o.pos>p.pos && o.pos<bestPos){ bestPos=o.pos; best=i; } });
  return best;
}

/* --------------------------- Le portail ---------------------------- */
function portalChallenge(){
  return new Promise(async function(resolve){
    var ps=$("portalScreen"); var locks=ps.querySelectorAll(".lock");
    for(var i=0;i<3;i++){ locks[i].classList.remove("open"); locks[i].textContent="🔒"; }
    $("portalStatus").textContent="Ouvre la 1re serrure…";
    ps.classList.add("show");
    await sleep(500);
    for(var n=0;n<3;n++){
      var r=await askQuestion({cat:G.category, record:true, contextLabel:"Serrure "+(n+1)+"/3"});
      if(r.correct){
        locks[n].classList.add("open"); locks[n].textContent="🔓";
        $("portalStatus").textContent=(n+1)+" / 3 serrures ouvertes !";
        await sleep(500);
      } else {
        $("portalStatus").textContent="La grille se referme d'un coup !";
        await sleep(900); ps.classList.remove("show"); return resolve(false);
      }
    }
    $("portalStatus").textContent="Le portail s'ouvre ! 🎉";
    await sleep(700); ps.classList.remove("show"); resolve(true);
  });
}

/* ============================== BOTS =============================== */
async function botsPlay(){
  for(var i=1;i<G.players.length && !G.over;i++){
    await botTurn(i);
    if(G.over) return;
  }
}
async function botTurn(i){
  var b=G.players[i];
  if(b.skip){ b.skip=false; return; }
  var start=b.pos;
  var d=1+randint(6);
  var ok=Math.random()<BOT_SUCCESS;
  if(ok){
    // avance en gérant les obstacles
    var target=b.pos+d, blocked=false, cur=b.pos;
    for(var s=b.pos+1;s<=Math.min(target,BOARD);s++){
      if(OBSTACLES[s]){ if(Math.random()<BOT_SUCCESS){ /* franchit */ } else { target=s-1; blocked=true; break; } }
    }
    await botStep(i, Math.min(target,BOARD));
  } else {
    await botStep(i, Math.max(0,b.pos-d));
  }
  // portail
  if(b.pos>=BOARD){
    var pass = Math.random()<BOT_SUCCESS && Math.random()<BOT_SUCCESS && Math.random()<BOT_SUCCESS;
    if(pass){ return finishGame(false, i); }
    else { await botStep(i, start); toast(animalById(b.animalId).name+" a raté le portail !"); return; }
  }
  // effet de case (simulé, pas d'historique)
  await botSpecial(i);
  if(b.pos>=BOARD){
    var pass2 = Math.random()<BOT_SUCCESS && Math.random()<BOT_SUCCESS && Math.random()<BOT_SUCCESS;
    if(pass2){ return finishGame(false, i); }
    else { await botStep(i, start); }
  }
}
async function botStep(i, target){
  var b=G.players[i]; target=clamp(target,0,BOARD);
  var dir=target>b.pos?1:-1;
  while(b.pos!==target){ b.pos+=dir; drawBoard(); await sleep(45); }
  drawPlayersMini();
}
async function botSpecial(i){
  var b=G.players[i]; if(b.pos<=0||b.pos>=BOARD) return;
  var type=SPECIALS[b.pos]; if(!type) return;
  if(type==="banane"){ await botStep(i, b.pos+1+randint(6)); }
  else if(type==="toboggan"){ await botStep(i, b.pos+4); }
  else if(type==="gardien"){ if(Math.random()>=BOT_SUCCESS) await botStep(i, Math.max(0,b.pos-3)); }
  else if(type==="defi"){ if(Math.random()<BOT_SUCCESS) await botStep(i, b.pos+3); else await botStep(i, Math.max(0,b.pos-1)); }
  else if(type==="duel"){
    if(Math.random()<BOT_SUCCESS){ var a=nearestAhead(i); if(a>=0){ var t=b.pos; b.pos=G.players[a].pos; G.players[a].pos=t; drawBoard(); drawPlayersMini(); } }
  }
  else if(type==="mystere"){
    var r=randint(4);
    if(r===0) await botStep(i, b.pos+2); else if(r===1) await botStep(i, b.pos+1);
    else if(r===2) await botStep(i, Math.max(0,b.pos-1)); else b.skip=true;
  }
}

/* ========================== FIN DE PARTIE ========================== */
function finishGame(playerWon, winnerIndex){
  G.over=true; busy=false; $("rollBtn").disabled=true;
  var winner=G.players[winnerIndex];
  var a=animalById(winner.animalId);
  if(playerWon){
    store.missions[a.id]=true;   // RG14
  }
  saveGameState(); persist();
  // écran de fin
  var ctx=$("endArt").getContext("2d"); ctx.clearRect(0,0,96,96);
  SPRITES.animal(ctx, a.id, 0, 0, 6);
  var title=$("endTitle");
  var bw=$("endBubbleWrap"); bw.innerHTML="";
  if(playerWon){
    title.textContent="ÉVASION RÉUSSIE !"; title.className="win";
    var phrase=a.phrases[randint(a.phrases.length)];   // RG13
    bw.innerHTML="<div class='bubble'>« "+phrase+" »</div>";
    $("endMsg").textContent="Mission accomplie : "+a.name+" est libre ! ✓";
    updateMissionProgress(); buildSelect();
  } else {
    title.textContent="Presque !"; title.className="lose";
    $("endMsg").textContent=a.name+" s'est échappé avant toi. Tente une revanche !";
  }
  $("endScreen").classList.add("show");
}

/* ==================================================================== */
/*                            HISTORIQUE                                */
/* ==================================================================== */
function renderHistory(){
  var list=$("histList"); list.innerHTML="";
  var ok=0, ko=0;
  store.history.forEach(function(h){ if(h.result) ok++; else ko++; });
  $("statOk").textContent="✓ "+ok; $("statKo").textContent="✗ "+ko;
  if(store.history.length===0){ list.innerHTML="<div class='empty'>Aucune question jouée pour l'instant.<br>Lance une partie pour remplir ton carnet de révision !</div>"; return; }
  store.history.forEach(function(h){
    var it=document.createElement("div"); it.className="hist-item";
    var res=document.createElement("div"); res.className="hist-res "+(h.result?"ok":"ko"); res.textContent=h.result?"✓":"✗";
    var main=document.createElement("div"); main.className="hist-main";
    var cat=document.createElement("span"); cat.className="hist-cat"; cat.textContent=CAT_LABEL[h.cat]||h.cat;
    cat.style.background=CAT_COLOR[h.cat]||"#888";
    var ph=document.createElement("div"); ph.className="hist-phrase";
    ph.innerHTML=escapeHtml(h.phrase).replace("___","<span class='fill'>"+escapeHtml(h.options[h.answer])+"</span>");
    main.appendChild(cat); main.appendChild(ph);
    if(!h.result){
      var w=document.createElement("div"); w.className="hist-wrong";
      w.textContent = (h.chosen==null) ? "Ta réponse : (temps écoulé)" : "Ta réponse : "+h.options[h.chosen];
      main.appendChild(w);
    }
    it.appendChild(res); it.appendChild(main); list.appendChild(it);
  });
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

/* ==================================================================== */
/*                        NAVIGATION / ONGLETS                          */
/* ==================================================================== */
function showScreen(name){
  ["selectScreen","gameScreen","histScreen"].forEach(function(id){ $(id).classList.remove("active"); });
  if(name==="select") $("selectScreen").classList.add("active");
  else if(name==="game") $("gameScreen").classList.add("active");
  else if(name==="hist") $("histScreen").classList.add("active");
}
function setTab(which){
  $("tabGame").classList.toggle("active", which==="game");
  $("tabHist").classList.toggle("active", which==="hist");
}

/* ============================== INIT =============================== */
function init(){
  loadSave();
  initBoard();
  buildSelect();

  $("startBtn").onclick=function(){ if(selectedAnimal) startGame(selectedAnimal); };

  $("rollBtn").onclick=function(){ playerRoll(); };

  $("tabGame").onclick=function(){
    setTab("game");
    if(G){ showScreen("game"); drawBoard(); } else showScreen("select");
  };
  $("tabHist").onclick=function(){ setTab("hist"); showScreen("hist"); renderHistory(); };

  $("clearHist").onclick=function(){
    if(store.history.length && confirm("Effacer tout l'historique des questions ?")){
      store.history=[]; persist(); renderHistory();
    }
  };

  $("rematchBtn").onclick=function(){ $("endScreen").classList.remove("show"); startGame(G? G.animalId : selectedAnimal); };
  $("backSelectBtn").onclick=function(){
    $("endScreen").classList.remove("show"); store.game=null; persist();
    G=null; buildSelect(); showScreen("select"); setTab("game");
  };

  // restauration d'une partie en cours (RG15)
  if(restoreGame()){ enterGame(); toast("Partie reprise !"); }
  else { showScreen("select"); }

  // redessine le plateau au redimensionnement (échelle du canvas)
  window.addEventListener("resize", function(){ if(G) drawBoard(); });
}
document.addEventListener("DOMContentLoaded", init);
</script>
